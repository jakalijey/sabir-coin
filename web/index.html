<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>SABIR</title>
<meta name="description" content="SABIR is a memecoin on NEAR you cannot buy. Walk a five-minute bridge, get a soul NFT, and earn 1 SABIR a day by waiting.">
<link rel="canonical" href="https://sabir.heylogram.com/">
<meta name="theme-color" content="#1C1712">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="icon" href="icon-32.png" sizes="32x32" type="image/png">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="manifest" href="manifest.json">
<meta property="og:type" content="website">
<meta property="og:site_name" content="SABIR">
<meta property="og:title" content="SABIR: can you last forty days?">
<meta property="og:description" content="A memecoin on NEAR you cannot buy, only wait for.">
<meta property="og:url" content="https://sabir.heylogram.com/">
<meta property="og:image" content="https://sabir.heylogram.com/og.png">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:image" content="https://sabir.heylogram.com/og.png">
<style>
:root{--bg:#1C1712;--bg2:#2A231B;--ink:#F3E9D7;--dim:#B9AC96;--sand:#D4A24A;--sand2:#E8BE72;--line:rgba(212,162,74,.26);--hot:#FF9A5A}
*{box-sizing:border-box}
html,body{margin:0;background:#07070E;color:var(--ink);font:16px/1.55 system-ui,-apple-system,"Segoe UI",sans-serif;-webkit-font-smoothing:antialiased}
body.playing{overflow:hidden}
canvas#c{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:manipulation}
button{font:inherit;color:inherit;cursor:pointer}
.serif{font-family:Georgia,"Times New Roman",serif}
#landing{position:relative;z-index:2}
body.playing #landing{display:none}
.hero{min-height:100vh;min-height:100svh;display:flex;flex-direction:column;justify-content:center;align-items:flex-start;padding:clamp(72px,8vw,110px) clamp(20px,6vw,88px);background:linear-gradient(90deg,rgba(7,7,14,.88) 0%,rgba(7,7,14,.62) 42%,rgba(7,7,14,0) 72%)}
.brand{position:absolute;top:calc(env(safe-area-inset-top) + 20px);left:clamp(20px,6vw,88px);letter-spacing:.38em;color:var(--sand);font:400 18px/1 Georgia,serif}
.brand small{letter-spacing:.06em;font:italic 400 15px/1 Georgia,serif;color:var(--dim);margin-left:8px}
.lang{position:absolute;top:calc(env(safe-area-inset-top) + 12px);right:clamp(14px,3vw,36px);min-width:48px;min-height:44px;background:rgba(28,23,18,.6);border:1px solid var(--line);border-radius:10px;color:var(--sand2)}
.kicker{color:var(--sand2);margin:0 0 10px;font-size:clamp(16px,1.5vw,20px)}
h1{font:400 clamp(40px,6.6vw,92px)/1.04 Georgia,serif;margin:0 0 20px;max-width:13ch}
.lead{max-width:54ch;margin:0 0 28px;color:#DCCFB8;font-size:clamp(17px,1.5vw,21px)}
.cta{background:linear-gradient(180deg,var(--sand2),var(--sand));color:#1C1712;border:0;border-radius:12px;padding:0 30px;min-height:58px;font-weight:700;font-size:19px}
.cta:hover{filter:brightness(1.07)}
.note{color:var(--dim);font-size:14px;margin:14px 0 0}
.sections{position:relative;background:var(--bg);padding:clamp(36px,5vw,72px) clamp(20px,6vw,88px)}
.sections h2{font:400 clamp(26px,3vw,38px)/1.2 Georgia,serif;margin:0 0 20px}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:16px;margin-bottom:clamp(36px,5vw,64px)}
.card{background:var(--bg2);border:1px solid var(--line);border-radius:14px;padding:20px 22px}
.card h3{font:400 23px/1.2 Georgia,serif;margin:0 0 8px;color:var(--sand2)}
.card p{margin:0;color:#DCCFB8}
.name{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:20px;margin-bottom:clamp(36px,5vw,64px)}
.word{font:400 clamp(58px,8vw,104px)/1 Georgia,serif;color:var(--sand2)}
.say{color:var(--dim);margin:8px 0 0}
.saying{margin:0 0 16px}
.saying q{font:400 22px/1.3 Georgia,serif;display:block;quotes:none}
.saying span{color:var(--dim)}
.walls{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:16px}
.wall{background:var(--bg2);border:1px solid var(--line);border-radius:14px;padding:18px 20px;min-height:110px}
.wall h3{font-size:15px;color:var(--sand2);margin:0 0 10px;font-weight:600}
.wall ul{list-style:none;margin:0;padding:0}
.wall li{padding:6px 0;border-top:1px solid rgba(212,162,74,.12);color:#DCCFB8;overflow-wrap:anywhere}
#book li{display:flex;justify-content:space-between;gap:12px}
#book li b{color:var(--sand2);font-weight:600;white-space:nowrap}
#hud{position:fixed;inset:0;z-index:3;pointer-events:none;display:none}
body.playing #hud{display:block}
#hud button{pointer-events:auto}
.top{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;padding:calc(env(safe-area-inset-top) + 14px) clamp(14px,3vw,32px) 0}
#clock{font:400 clamp(30px,3.6vw,46px)/1 Georgia,serif;font-variant-numeric:tabular-nums;text-shadow:0 2px 12px #000}
#clockNote{display:block;color:var(--dim);font-size:13px;margin-top:4px;text-shadow:0 1px 8px #000}
#skip{background:rgba(28,20,14,.74);border:1px solid rgba(255,140,80,.6);border-radius:12px;padding:9px 16px;text-align:right;min-height:58px}
#skip span{display:block;font-size:14px;color:#F3E9D7}
#skip b{display:block;color:var(--hot);font:400 23px/1.15 Georgia,serif;font-variant-numeric:tabular-nums}
#skip:hover{background:rgba(70,36,18,.85)}
#stage{position:absolute;left:0;right:0;bottom:calc(env(safe-area-inset-bottom) + 58px);padding:0 clamp(16px,4vw,48px);text-align:center}
#prompt{display:inline-block;font:400 clamp(21px,2.5vw,33px)/1.3 Georgia,serif;margin:0 auto 14px;max-width:25em;padding:6px 18px;border-radius:14px;background:rgba(8,6,8,.46);text-shadow:0 2px 10px #000}
#prompt:empty{background:none;padding:0}
#choices{display:flex;justify-content:center;gap:10px;flex-wrap:wrap}
.ch{background:rgba(28,23,18,.84);border:1px solid rgba(232,190,114,.55);color:var(--ink);padding:0 22px;border-radius:12px;min-height:52px;font-size:17px}
.ch:hover{background:rgba(70,54,30,.92)}
.ch.hold{min-width:min(42vw,300px);min-height:clamp(84px,14vh,130px);touch-action:none;user-select:none;-webkit-user-select:none}
.ch.hold.on{background:rgba(120,86,36,.92)}
.runes{display:flex;justify-content:center;gap:clamp(10px,2vw,20px);width:100%;margin-bottom:6px}
.rune{width:clamp(60px,9vw,88px);height:clamp(60px,9vw,88px);padding:0;border-radius:12px}
.rune svg{display:block;width:100%;height:100%}
.bottom{position:absolute;left:0;right:0;bottom:calc(env(safe-area-inset-bottom) + 10px);display:flex;justify-content:space-between;padding:0 clamp(12px,3vw,28px)}
.mini{background:rgba(28,23,18,.6);border:1px solid var(--line);border-radius:10px;min-height:40px;padding:0 12px;font-size:13px;color:var(--dim)}
.modal{position:fixed;inset:0;z-index:6;display:none;align-items:center;justify-content:center;padding:16px;background:rgba(5,4,8,.55)}
.modal.on{display:flex}
.modal>div{background:var(--bg2);border:1px solid rgba(255,140,80,.5);border-radius:16px;padding:24px;max-width:430px;width:100%;text-align:center}
.modal h3{font:400 25px/1.3 Georgia,serif;margin:0 0 6px}
.modal p{color:var(--dim);margin:0 0 18px}
.modal .row{display:flex;gap:10px;flex-wrap:wrap}
.modal .row button{flex:1 1 150px;min-height:52px;border-radius:12px;border:1px solid var(--line);background:transparent}
.modal .row .go{background:linear-gradient(180deg,#FFB27E,#F08A4C);color:#1C1712;border:0;font-weight:700}
#result{position:fixed;inset:0;z-index:5;display:none;overflow:auto;background:rgba(7,7,14,.82);padding:clamp(16px,3vw,40px)}
#result.on{display:block;animation:rise .9s ease}
@keyframes rise{from{opacity:0}to{opacity:1}}
.res{display:grid;grid-template-columns:minmax(0,5fr) minmax(0,6fr);gap:clamp(18px,3.4vw,48px);align-items:start}
#soul svg{display:block;width:min(100%,calc((100vh - 70px)*.714));height:auto;border-radius:14px;margin-left:auto}
.stratum{color:var(--sand2);font-size:15px;margin:0 0 2px}
.res h2{font:400 clamp(32px,3.8vw,52px)/1.1 Georgia,serif;margin:0 0 16px}
.gap{font:400 clamp(20px,1.9vw,26px)/1.4 Georgia,serif;margin:0 0 16px;padding-left:14px;border-left:2px solid var(--sand)}
.verdict{color:#DCCFB8;margin:0 0 16px}
body.front [data-yer=app],body.app [data-yer=on]{display:none!important}
.story{font:italic 400 clamp(16px,1.3vw,18px)/1.6 Georgia,serif;color:#E8DCC6;margin:0 0 16px;white-space:pre-line}
.rows{margin:0 0 16px;padding:0;list-style:none;color:var(--dim)}
.rows li{padding:5px 0}
.bars{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px;margin-bottom:16px}
.bar{font-size:14px;color:var(--dim)}
.track{height:7px;background:#3A2F23;border-radius:4px;overflow:hidden;margin-top:5px}
.track i{display:block;height:100%;background:linear-gradient(90deg,var(--sand),var(--sand2))}
.after{background:var(--bg2);border:1px solid var(--line);border-radius:14px;padding:14px 18px;margin-bottom:14px}
.after .v{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap}
.after b{color:var(--sand2);font-weight:600}
.after input{width:100%;accent-color:var(--sand);height:32px}
.after p{margin:0;color:var(--dim)}
.actions{display:flex;gap:10px;flex-wrap:wrap}
.actions a,.actions button{display:inline-flex;align-items:center;justify-content:center;min-height:52px;padding:0 22px;border-radius:12px;border:1px solid var(--sand);background:transparent;color:var(--sand2);text-decoration:none}
.actions .pri{background:linear-gradient(180deg,var(--sand2),var(--sand));color:#1C1712;border:0;font-weight:700}
.fine{color:var(--dim);font-size:14px;margin:12px 0 0}
.log #rTrace svg{display:block;width:100%;height:auto;margin:8px 0}
.log ul{list-style:none;margin:10px 0 0;padding:0;color:#DCCFB8;font-size:15px}
.log li{padding:3px 0}
.log li b{display:inline-block;min-width:44px;font-variant-numeric:tabular-nums}
#forms{display:flex;flex-wrap:wrap;gap:6px;justify-content:flex-end;margin-top:10px}
#forms button{min-height:40px;padding:0 12px;border-radius:9px;border:1px solid var(--line);background:rgba(28,23,18,.7);color:var(--dim);font-size:14px}
#forms button.on{border-color:var(--sand);color:var(--sand2)}
@media (max-width:860px){.res{grid-template-columns:minmax(0,1fr)}#soul svg{width:100%;margin:0}.hero{background:linear-gradient(180deg,rgba(7,7,14,.86) 0%,rgba(7,7,14,.5) 70%,rgba(7,7,14,.2) 100%)}}

@keyframes lspin{to{transform:rotate(360deg)}}
@keyframes lrev{to{transform:rotate(-360deg)}}
@keyframes lbreathe{0%,100%{transform:scale(1)}50%{transform:scale(1.022)}}
@keyframes lflap{0%,100%{transform:scale(1,1)}50%{transform:scale(1.025,.985)}}
@keyframes lpulse{0%,100%{opacity:1}50%{opacity:.62}}
@keyframes ldrift{from{transform:translateY(14px)}to{transform:translateY(-22px)}}
@keyframes ldrift2{from{transform:translateY(-14px)}to{transform:translateY(20px)}}
@keyframes lflick{from{transform:translateY(0) scaleY(1)}to{transform:translateY(5px) scaleY(.965)}}
.canli .l-spin{animation:lspin 110s linear infinite}
.canli .l-rev{animation:lrev 150s linear infinite}
.canli .l-breathe{animation:lbreathe 7s ease-in-out infinite}
.canli .l-flap{animation:lflap 5.5s ease-in-out infinite}
.canli .l-pulse{animation:lpulse 2.4s ease-in-out infinite}
.canli .l-drift{animation:ldrift 9s ease-in-out infinite alternate}
.canli .l-drift2{animation:ldrift2 12s ease-in-out infinite alternate}
.canli .l-flick{transform-origin:0 1090px;animation:lflick 1.1s ease-in-out infinite alternate}
.canli .l-flick2{transform-origin:0 1090px;animation:lflick .8s ease-in-out infinite alternate-reverse}
.wallet{margin-top:12px;display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.wallet .note{margin:0}
.wbtn{min-height:44px;padding:0 16px;border-radius:10px;border:1px solid var(--line);background:rgba(28,23,18,.65);color:var(--sand2);font-size:15px}
.mnote{margin:-6px 0 16px}
.souls{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(210px,100%),1fr));gap:16px;margin-bottom:clamp(36px,5vw,64px)}
.soulc{background:var(--bg2);border:1px solid var(--line);border-radius:14px;padding:12px;display:flex;flex-direction:column;gap:8px;min-width:0}
.soulc .art svg{display:block;width:100%;height:auto;border-radius:8px}
.soulc h3{font-size:15px;font-weight:600;margin:0;color:var(--sand2)}
.soulc p{margin:0;color:var(--dim);font-size:14px;overflow-wrap:anywhere}
.soulc .acts{display:flex;flex-wrap:wrap;gap:8px}
.soulc .sell{display:flex;gap:8px;width:100%}
.soulc input{min-width:0;flex:1;min-height:44px;background:#0f0c09;border:1px solid var(--line);border-radius:10px;color:var(--ink);padding:0 10px;font-size:16px}
.soulc button,.acct button{min-height:44px;border-radius:10px;border:1px solid var(--line);background:transparent;color:var(--ink);padding:0 12px;font-size:15px}
.soulc button.go,.acct button.go{background:linear-gradient(180deg,var(--sand2),var(--sand));color:#1C1712;border:0;font-weight:700}
.acct{display:flex;flex-wrap:wrap;gap:12px 28px;align-items:center;background:var(--bg2);border:1px solid var(--line);border-radius:14px;padding:14px 18px;margin-bottom:16px}
.acct:empty{display:none}
.acct div{min-width:0}
.acct small{display:block;color:var(--dim);font-size:13px}
.acct b{color:var(--sand2);font-weight:600}
.acct .feed{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.acct input{min-width:0;width:130px;min-height:44px;background:#0f0c09;border:1px solid var(--line);border-radius:10px;color:var(--ink);padding:0 10px;font-size:16px}
#tx .row button{color:var(--ink)}
#tx .row .go{color:#1C1712}
body:not(.dev) #jump,body:not(.dev) #forms{display:none}
@media (prefers-reduced-motion:reduce){.canli *{animation:none!important}}
#traits{color:var(--dim);font-size:13px;text-align:right;margin:8px 0 0}
.money{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(340px,100%),1fr));gap:16px;margin-bottom:16px}
.facts{list-style:none;margin:0;padding:0}
.facts li{padding:10px 0;border-top:1px solid rgba(212,162,74,.12);color:#DCCFB8}
.facts li:first-child{border-top:0;padding-top:0}
.calc{margin:0}
.calcg{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:12px;margin-top:10px}
.calcg small{display:block;color:var(--dim);font-size:13px}
.calcg b{color:var(--sand2);font:400 24px/1.25 Georgia,serif}
#stories{margin-bottom:10px}
#stories li{display:flex;justify-content:space-between;gap:12px}
#stories li b{color:var(--sand2);font-weight:600;white-space:nowrap}
.faq{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(380px,100%),1fr));gap:0 28px;margin-bottom:clamp(36px,5vw,64px)}
.faq details{border-top:1px solid var(--line);padding:12px 0}
.faq summary{cursor:pointer;font-weight:600;min-height:28px}
.faq p{margin:8px 0 0;color:#DCCFB8}
.soulc .kv{list-style:none;margin:0;padding:0;font-size:14px}
.soulc .kv li{display:flex;justify-content:space-between;gap:10px;padding:3px 0;color:var(--dim)}
.soulc .kv b{color:var(--ink);font-weight:600;text-align:right;overflow-wrap:anywhere}
</style>
</head>
<body>
<canvas id="c"></canvas>

<div id="landing">
  <header class="hero">
    <div class="brand">SABIR <small data-t="brandS"></small></div>
    <button class="lang" id="lang" type="button"></button>
    <p class="kicker" data-t="kicker"></p>
    <h1 data-t="title"></h1>
    <p class="lead" data-t="lead"></p>
    <button class="cta" id="begin" type="button" data-t="start"></button>
    <div class="wallet" id="wallet" data-yer="app"></div>
    <p class="note"><span data-t="practice"></span> <a href="#how" id="howLink" style="color:var(--sand2)" data-t="howT"></a></p>
    <p class="note" id="modeNote"></p>
  </header>
  <main class="sections" id="how">
    <h2 data-t="howT" data-yer="on"></h2>
    <div class="cards" data-yer="on">
      <article class="card"><h3 data-t="h1T"></h3><p data-t="h1"></p></article>
      <article class="card"><h3 data-t="h2T"></h3><p data-t="h2"></p></article>
      <article class="card"><h3 data-t="h3T"></h3><p data-t="h3"></p></article>
    </div>
    <h2 data-t="moneyT" data-yer="on"></h2>
    <div class="money" data-yer="on">
      <ul class="facts"><li data-t="m1"></li><li data-t="m2"></li><li data-t="m3"></li><li data-t="m4"></li><li data-t="m5"></li></ul>
      <div class="after calc">
        <div class="v"><span data-t="calcL"></span><b id="calcD"></b></div>
        <input type="range" id="calcR" min="0" max="9" step="1" value="3" aria-label="days">
        <div class="calcg" id="calcOut"></div>
      </div>
    </div>
    <div class="walls" id="stories" data-yer="on"></div>
    <p class="note mnote" style="margin:0 0 clamp(36px,5vw,64px)" data-t="storyNote" data-yer="on"></p>
    <h2 data-t="faqT" data-yer="on"></h2>
    <div class="faq" id="faq" data-yer="on"></div>
    <h2 data-t="nameT" data-yer="on"></h2>
    <div class="name" data-yer="on">
      <div><div class="word" lang="tr">Sabır</div><p class="say" data-t="nameSay"></p></div>
      <div>
        <div class="saying"><q lang="tr">Sabrın sonu selamettir.</q><span data-t="s1"></span></div>
        <div class="saying"><q lang="tr">Sabreden derviş muradına ermiş.</q><span data-t="s2"></span></div>
      </div>
    </div>
    <section id="mineBox" data-yer="app" hidden><h2 data-t="mineT"></h2><div class="acct" id="acct"></div><div class="souls" id="mine"></div></section>
    <h2 data-t="vaultT" data-yer="app"></h2>
    <p class="note mnote" data-t="vaultNote" data-yer="app"></p>
    <div class="acct" id="vaultStats" data-yer="app"></div>
    <h2 data-t="marketT" data-yer="app"></h2>
    <p class="note mnote" data-t="marketNote" data-yer="app"></p>
    <div class="souls" id="market" data-yer="app"></div>
    <h2 data-t="bookT" data-yer="app"></h2>
    <p class="note mnote" data-t="bookNote" data-yer="app"></p>
    <div class="walls" id="book" data-yer="app"></div>
    <h2 data-t="wallsT" data-yer="app"></h2>
    <div class="walls" data-yer="app">
      <div class="wall"><h3 data-t="wall1"></h3><ul id="w1"></ul></div>
      <div class="wall"><h3 data-t="wall2"></h3><ul id="w2"></ul></div>
    </div>
    <p class="note mnote" style="margin-top:clamp(36px,5vw,64px)"><a href="privacy" style="color:var(--sand2)" data-t="privacyT"></a> · <a href="terms" style="color:var(--sand2)" data-t="termsT"></a> · <a href="mailto:sabir@heylogram.com" style="color:var(--sand2)">sabir@heylogram.com</a></p>
  </main>
</div>

<div id="hud">
  <div class="top">
    <div><span id="clock">5:00</span><small id="clockNote" data-t="clockNote"></small></div>
    <button id="skip" type="button"><span data-t="skip"></span><b id="skipPrice"></b></button>
  </div>
  <div id="stage"><p id="prompt"></p><div id="choices"></div></div>
  <div class="bottom">
    <button class="mini" id="mute" type="button"></button>
    <button class="mini" id="jump" type="button" data-t="jump"></button>
  </div>
</div>

<div class="modal" id="pay"><div>
  <h3 id="payQ"></h3><p data-t="payNote"></p>
  <div class="row"><button type="button" id="payStay" data-t="payStay"></button><button type="button" class="go" id="payGo" data-t="payGo"></button></div>
</div></div>

<div class="modal" id="tx"><div>
  <h3 id="txT"></h3><p id="txP"></p>
  <div class="row" id="txR"></div>
</div></div>

<section id="result">
  <div class="res">
    <div><div id="soul" class="canli"></div><p id="traits"></p><div id="forms"></div></div>
    <div>
      <p class="stratum" id="rStratum"></p>
      <h2 id="rTitle"></h2>
      <p class="gap" id="rGap"></p>
      <p class="story" id="rStory"></p>

// ---- Direction 3: mended stone ----
function artTas(m){
  const R=rng(hash(m.seed+'ts')),cx=500,cy=610,id='s'+hash(m.seed+m.kat).toString(36);

  const radii=[0,120,230,360,510,690,900,1200],sect=[7,11,15,19,23,27,31];
  const grid=radii.map((r,i)=>{const n=i===0?1:sect[i-1];return Array.from({length:n},(_,j)=>{if(i===0)return[0,0];const a=(j+R()*.5)/n*TAU,rr=r*(.92+R()*.16);return pol(rr,a)})});
  let st='';
  const move=[34,12,3,0][m.kat];
  for(let i=0;i<radii.length-1;i++){
    const inner=grid[i],outer=grid[i+1],n=sect[i];
    for(let j=0;j<n;j++){
      const a=outer[j],b=outer[(j+1)%n],c=inner[Math.floor(j/n*inner.length+1)%inner.length]||[0,0],d=inner[Math.floor(j/n*inner.length)%inner.length]||[0,0];
      const mx=(a[0]+b[0]+c[0]+d[0])/4,my=(a[1]+b[1]+c[1]+d[1])/4,l=Math.hypot(mx,my)||1,sh=move*(.4+R())*unit(1-i*.06);
      const dx=mx/l*sh,dy=my/l*sh;
      const v0=20+R()*24,tone=[v0+3,v0+1,v0-2];
      const lit=unit(1-Math.hypot(mx,my)/760);
      const col=mix(tone.map(v=>v/255),[.34,.3,.25],lit*.5);
      const pts=[a,b,c,d].map(p=>f(p[0]+dx)+' '+f(p[1]+dy)).join('L');

  let gl='';
  if(m.kat<3)gl=`<circle r="${[720,480,260,0][m.kat]}" fill="url(#${id}e)"/>`;
  const cnt=[12,8,6,5][m.kat];
  let wide='',mid='',thin='';
  function crack(a,r,len,w0){let p=pol(r,a),d=`M${f(p[0])} ${f(p[1])}`;let rr=r,aa=a;const stepL=30/(.6+rr/900),steps=Math.ceil(len/stepL);for(let i=0;i<steps;i++){rr+=stepL*(.7+R()*.6);aa+=(R()-.5)*(26/rr+.05);p=pol(rr,aa);d+=`L${f(p[0])} ${f(p[1])}`;if(w0>0&&i>2&&R()<.13)crack(aa+(R()<.5?-1:1)*(.22+R()*.3),rr,len*(.3+R()*.2),w0-1)}wide+=d;mid+=d;thin+=d}
  for(let i=0;i<cnt;i++)crack(i/cnt*TAU+R()*.3,Math.max(70,r0Base()),860,1);
  function r0Base(){return[66,88,104,122][m.kat]+6}
  let inlay='';
  const star=(r)=>{let d='';for(let i=0;i<16;i++){const p=pol(i%2?r*.56:r,i/16*TAU-TAU/4);d+=(i?'L':'M')+f(p[0])+' '+f(p[1])}return d+'Z'};
  const r0=[66,88,104,122][m.kat];
  if(m.kat===0)inlay=`<circle r="${r0}" fill="#090604" stroke="${seam[0]}" stroke-width="5"/><circle r="${r0*.6}" fill="url(#${id}e)"/>`;
  else inlay=`<circle r="${r0*1.28}" fill="#12100D" stroke="url(#${id}a)" stroke-width="4"/><path d="${star(r0)}" fill="url(#${id}a)" stroke="#12100D" stroke-width="2"/><circle r="${r0*.3}" fill="${hex(m.color)}" stroke="#12100D" stroke-width="3"/><circle r="${r0*.11}" fill="#FFFFFF"/>`;
  let o=`<defs><radialGradient id="${id}e"><stop offset="0" stop-color="#FFB060" stop-opacity=".95"/><stop offset=".4" stop-color="#E0491A" stop-opacity=".5"/><stop offset="1" stop-color="#E0491A" stop-opacity="0"/></radialGradient><linearGradient id="${id}a" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="${seam[1]}"/><stop offset=".5" stop-color="${seam[0]}"/><stop offset="1" stop-color="${seam[1]}"/></linearGradient></defs><rect width="1000" height="1400" fill="#0B0A08"/><g transform="translate(${cx} ${cy})">${gl}${st}<path d="${wide}" fill="none" stroke="${seam[0]}" stroke-opacity=".22" stroke-width="16" stroke-linejoin="round" stroke-linecap="round"/><path d="${mid}" fill="none" stroke="${seam[0]}" stroke-width="4.6" stroke-linejoin="round" stroke-linecap="round"/><path d="${thin}" fill="none" stroke="${seam[1]}" stroke-width="1.5" stroke-linejoin="round" stroke-linecap="round"/>${inlay}</g>`;
  o+=`<rect x="0" y="1050" width="1000" height="350" fill="#0B0A08" fill-opacity=".97"/><rect x="0" y="1050" width="1000" height="2" fill="${seam[0]}" fill-opacity=".6"/>`;
  let sl='';m.seals.forEach((v,i)=>{const x=500+(i-3)*58;sl+=`<g transform="translate(${x} 1102) scale(.62)">`+(v?`<circle r="30" fill="url(#${id}a)"/><path d="${ICON[i]}" fill="none" stroke="#12100D" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round"/>`:`<circle r="30" fill="none" stroke="#5A5145" stroke-width="2.4"/>`)+'</g>'});

  return`<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1400" role="img" aria-label="Soul">${o}</svg>`;
}

// ---- Direction 4: marbling ----
function artEbru(m){
  const R=rng(hash(m.seed+'eb')),cx=500,cy=560;
  const hot=['#140B0B','#B22A12','#FF8A2C','#2A0F10','#E8501C','#5A1610'];
  const pal=m.kat===0?hot:[['#F3E7CF','#7A1E2B','#C9952E','#1E2F5B','#E8C98A','#3C1320'],['#F4E6CB','#B1321F','#E3A73A','#27395F','#F1D29A','#5A1A12'],['#EEF0DC','#1F6B57','#D8B24A','#173A5A','#A8D3B0','#0D2E28'],['#EAF0F2','#1B4C8C','#C9A24A','#7FB4C9','#F3E3BC','#0F2A55']][m.fi];
  const blobs=[];
  const drop=(x,y,r,c,n)=>{const r2=r*r;for(const b of blobs)for(const p of b.p){const dx=p[0]-x,dy=p[1]-y,d2=dx*dx+dy*dy||1e-6,k=Math.sqrt(1+r2/d2);p[0]=x+dx*k;p[1]=y+dy*k}const pts=[];for(let i=0;i<n;i++){const a=i/n*TAU;pts.push([x+r*Math.cos(a),y+r*Math.sin(a)])}blobs.push({p:pts,c})};
  const comb=(ax,ay,dx,dy,z,c)=>{const u=Math.pow(.5,1/c),nx=-dy,ny=dx;for(const b of blobs)for(const p of b.p){const d=Math.abs((p[0]-ax)*nx+(p[1]-ay)*ny),s=z*Math.pow(u,d);p[0]+=dx*s;p[1]+=dy*s}};
  const pull=(S,ph,z,sig,r0,r1)=>{const st=TAU/S;for(const b of blobs)for(const p of b.p){const dx=p[0]-cx,dy=p[1]-cy,r=Math.hypot(dx,dy);if(r<r0||r>r1)continue;const a=Math.atan2(dy,dx);let da=((a-ph)%st+st)%st;if(da>st/2)da-=st;const win=Math.sin(Math.PI*(r-r0)/(r1-r0)),w=Math.exp(-da*da/(sig*sig))*win,r2=Math.max(1,r-z*w);p[0]=cx+Math.cos(a)*r2;p[1]=cy+Math.sin(a)*r2}};
  const nS=[60,72,84,96][m.kat];
  for(let i=0;i<nS;i++)drop(R()*1000,R()*1400,15+R()*29,pal[1+Math.floor(R()*5)],28);
  const rings=[6,9,11,14][m.kat],seq=[pal[1],pal[4],pal[3],pal[2],pal[0],pal[1],pal[3],pal[4]];
  const fx=m.kat===0?cx+(R()-.5)*160:cx;
  for(let i=0;i<rings;i++)drop(fx,cy,92-i*2,seq[i%seq.length],120);
  const S=[3,5,8,10][m.kat],ph=R()*TAU;
  if(m.kat>=1){pull(S,ph,70,.2,30,430);pull(S,ph+TAU/S/2,-42,.3,40,430);pull(S*2,ph,18,.1,60,330)}
  if(m.kat===0){for(let i=0;i<10;i++)comb(60+i*100,0,0,1,(i%2?1:-1)*240,46);for(let i=0;i<4;i++)comb(0,240+i*280,1,0,(i%2?1:-1)*150,60)}
  if(m.kat===1){for(let i=0;i<3;i++)comb(120+i*380,0,0,1,(i%2?1:-1)*110,70)}
  if(m.kat===2)comb(0,cy+250,1,0,120,50);
  let o=`<rect width="1000" height="1400" fill="${pal[0]}"/>`;
  for(const b of blobs)o+=`<path d="M${b.p.map(p=>Math.round(p[0])+' '+Math.round(p[1])).join('L')}Z" fill="${b.c}"/>`;
  const dark=m.kat===0;
  o+=`<rect x="140" y="1048" width="720" height="284" fill="${dark?'#150B0B':'#F7F0E0'}" stroke="${pal[1]}" stroke-width="3"/><rect x="152" y="1060" width="696" height="260" fill="none" stroke="${pal[1]}" stroke-width="1"/>`;
  o+=sealRow(m,1108,62,.62,pal[1],dark?'#150B0B':'#F7F0E0',dark?'#6E3A2A':'#B9A98A');
  o+=caption(m,1192,dark?'#FF9A4A':pal[1],dark?'#F3E4CC':'#2A2118',dark?'#C9A98A':'#6A5A44');
  o+=`<text x="500" y="1312" text-anchor="middle" font-family="${SERIF}" font-size="16" letter-spacing="5" fill="${dark?'#8A6A58':'#8A7A5E'}">SABIR  No. ${m.no}</text>`;
  return svgWrap(o);
}

// ---- Direction 5: Iznik tile ----

  if(m.kat<3){let c='';const n=[16,7,2,0][m.kat];for(let i=0;i<n;i++){let x=R()*1000,y=R()*1000;c+=`M${f(x)} ${f(y)}`;for(let j=0;j<9;j++){x+=(R()-.5)*110;y+=30+R()*70;c+=`L${f(x)} ${f(y)}`}}o+=`<path d="${c}" fill="none" stroke="#2B2019" stroke-width="3.4" stroke-linejoin="round"/>`}

  let bead='';const nb=S*5;for(let i=0;i<nb;i++){const p=pol(Mr*.965,i/nb*TAU);bead+=`M${f(p[0]-3.4)} ${f(p[1])}a3.4 3.4 0 1 0 6.8 0a3.4 3.4 0 1 0 -6.8 0`}

// ---- Direction 6: kilim ----
function artKilim(m){
  const R=rng(hash(m.seed+'kl'));
  const P=[['#7E1F2A','#22305E','#E9DDC2','#C9952E','#241714','#3E7A6C'],['#9A2A1E','#1F2C55','#EADCBD','#D8A23A','#241511','#5C7A3E'],['#2C5A48','#1E2C4E','#E6DFC4','#C79A3A','#152019','#8E3A2A'],['#1F3A72','#7E2A26','#EBE1C9','#D2A53A','#141A2A','#2E8B8B']][m.fi];
  const cols=50,rows=52,cs=20,cxC=24.5;
  const meds=m.kat===3?[14,37]:m.kat===0?[26]:[15,36],seq=[P[2],P[1],P[3],P[5],P[2],P[4],P[3],P[1]];
  const grid=[];
  for(let y=0;y<rows;y++){
    const row=[];
    for(let x=0;x<cols;x++){
      const mx=Math.min(x,cols-1-x),my=Math.min(y,rows-1-y);let c;
      if(mx<2||my<2)c=P[4];
      else if(mx<6||my<6){const onSide=mx<6&&my>=6,t=onSide?y:x,z=Math.abs((t%8)-4),b=(onSide?mx:my)-2;c=b<z*.8?P[3]:P[1]}
      else if(mx<7||my<7)c=P[2];
      else{
        c=P[0];
        let best=1e9,dy0=0;for(const cy of meds){const dy=y-cy+.5;if(Math.abs(dy)<Math.abs(best)){best=dy;dy0=dy}}
        const dx=x-cxC,d=Math.abs(dx)+Math.abs(dy0),maxD=m.kat===0?9:13;
        if(d<maxD){c=seq[Math.floor(d/1.5)%seq.length]}
        else if(d<maxD+3){const ax=Math.floor(Math.abs(dx)),ay=Math.floor(Math.abs(dy0));if((ax%4<2)&&(ay%4<2))c=P[3]}
        else{const ax=Math.floor(Math.abs(dx)),ay=Math.floor(Math.abs(dy0));if(ax>13&&((ax+ay)%10<1||Math.abs(ax-ay)%10<1))c=P[2]}
      }
      row.push(c);
    }
    grid.push(row);
  }
  const shift=[.34,.14,.04,0][m.kat];
  for(let y=7;y<rows-7;y++){if(R()<shift){const k=(R()<.5?-1:1)*(1+Math.floor(R()*3)),r=grid[y].slice(7,cols-7);for(let x=7;x<cols-7;x++)grid[y][x]=r[((x-7+k)%r.length+r.length)%r.length]}}
  const holes=[9,3,1,0][m.kat];
  for(let h=0;h<holes;h++){const hx=6+R()*38,hy=6+R()*40,rr=(m.kat===0?2.2:1.6)+R()*(m.kat===0?2.8:1.4);for(let y=0;y<rows;y++)for(let x=0;x<cols;x++)if(Math.hypot(x-hx,(y-hy)*.9)<rr+R()*1.2)grid[y][x]=null}
  const by={};
  for(let y=0;y<rows;y++){let x=0;while(x<cols){const c=grid[y][x];let e=x+1;while(e<cols&&grid[y][e]===c)e++;if(c){by[c]=(by[c]||'')+`M${x*cs} ${y*cs}h${(e-x)*cs}v${cs}h${-(e-x)*cs}z`}x=e}}
  let o=`<rect width="1000" height="1400" fill="#17110D"/>`;
  let warp='';for(let x=10;x<1000;x+=10)warp+=`M${x} 0V1040`;
  o+=`<path d="${warp}" stroke="#CDBFA3" stroke-opacity=".24" stroke-width="1.2"/>`;
  for(const c in by)o+=`<path d="${by[c]}" fill="${c}"/>`;
  let tint='';for(let y=0;y<rows;y++)if(R()<.36)tint+=`<rect y="${y*cs}" width="1000" height="${cs}" fill="${R()<.5?'#FFFFFF':'#000000'}" fill-opacity="${(.03+R()*.05).toFixed(2)}"/>`;
  o+=tint;
  let weave='';for(let y=5;y<1040;y+=5)weave+=`M0 ${y}H1000`;
  o+=`<path d="${weave}" stroke="#000" stroke-opacity=".09" stroke-width="1"/>`;
  o+=`<rect y="1040" width="1000" height="360" fill="${P[4]}"/><rect y="1040" width="1000" height="6" fill="${P[3]}"/><rect y="1052" width="1000" height="2" fill="${P[3]}"/>`;
  let fringe='';for(let x=8;x<1000;x+=14)fringe+=`M${x} 1376v24`;
  o+=`<path d="${fringe}" stroke="${P[2]}" stroke-opacity=".55" stroke-width="3"/>`;
  o+=sealRow(m,1108,66,.68,P[3],P[4],'#6A5E4E');
  o+=caption(m,1200,P[3],P[2],'#B8AC94');

/* A walk, packed for the chain. Numbers only, except a title limited to plain letters:
   anything read back from the chain ends up inside an SVG shown to other people. */
const SKETCH_V=1,SHADOWS=['shN','shS','shC','shF'],LAYERS=['Chaos','Middle','Threshold','Builder'],RANKS=['Restless','Waiting','Steady','Stone','Mountain'],FIXED=95;
const b255=v=>Math.max(0,Math.min(255,Math.round(v)));
const cleanTitle=t=>String(t||'').replace(/[^A-Za-z0-9 -]/g,'').slice(0,40);
function encodeSketch(m){
  const out=[SKETCH_V],tr=m.trace||[],b=m.b||{},s=m.s||{},nib=v=>Math.max(0,Math.min(15,Math.round((v||0)*15)));
  for(let i=0;i<150;i+=2)out.push(nib(tr[i])<<4|nib(tr[i+1]));
  (m.color||[.5,.5,.5]).slice(0,3).forEach(c=>out.push(b255(c*255)));
  out.push(b255(m.sabirI*255),b255(m.zekaI*255));
  out.push((m.fi&3)|(m.stage&3)<<2|(Math.max(0,SHADOWS.indexOf(m.shadow))&3)<<4);
  let seals=0;(m.seals||[]).forEach((on,i)=>{if(on&&i<8)seals|=1<<i});out.push(seals);
  out.push(b255(b.tempt||0),b255(b.cancel||0),b255(b.awayN||0),b255(b.away||0),b255(b.idle||0),b255((b.fidget||0)*255),(b.calm?1:0)|Math.min(15,b.answered||0)<<1|Math.min(7,b.silent||0)<<5);
  ['O','C','E','A','N'].forEach(k=>out.push(Math.max(-127,Math.min(127,Math.round((s[k]||0)*8)))&255));
  const t=cleanTitle(m.title);out.push(t.length);for(let i=0;i<t.length;i++)out.push(t.charCodeAt(i));
  return new Uint8Array(out);
}
function decodeSketch(d){
  if(!d||d.length<FIXED+1||d[0]!==SKETCH_V)return null;
  const trace=[];for(let i=0;i<75;i++){trace.push((d[1+i]>>4)/15,(d[1+i]&15)/15)}
  const seals=[];for(let i=0;i<7;i++)seals.push(!!(d[82]&1<<i));
  const sb=x=>(x>127?x-256:x)/8;
  let title='';for(let i=0,n=Math.min(d[95],d.length-96);i<n;i++)title+=String.fromCharCode(d[96+i]);
  return{trace,color:[d[76]/255,d[77]/255,d[78]/255],sabirI:d[79]/255,zekaI:d[80]/255,fi:d[81]&3,stage:d[81]>>2&3,shadow:SHADOWS[d[81]>>4&3],seals,
    b:{tempt:d[83],cancel:d[84],awayN:d[85],away:d[86],idle:d[87],fidget:d[88]/255,calm:d[89]&1,answered:d[89]>>1&15,silent:d[89]>>5&7},
    s:{O:sb(d[90]),C:sb(d[91]),E:sb(d[92]),A:sb(d[93]),N:sb(d[94])},title:cleanTitle(title)};
}
function fromChain(v,dayLen){
  let raw=new Uint8Array(0);
  try{raw=Uint8Array.from(atob(v.sketch||''),c=>c.charCodeAt(0))}catch(e){}
  const d=decodeSketch(raw)||{trace:new Array(150).fill(0),color:[.62,.55,.4],sabirI:.5,zekaI:.5,fi:0,stage:1,shadow:'shN',seals:[],b:{},s:{O:0,C:0,E:0,A:0,N:0},title:'A Soul'};
  const age=Number(v.age_secs)||0,layer=LAYERS.indexOf(v.layer);
  return Object.assign(d,{seed:String(v.seed).replace(/[^0-9a-f]/g,''),no:String(Number(v.token_id)||0).padStart(4,'0'),kat:layer<0?0:layer,t:Math.min(300,Number(v.waited_secs)||0),crossed:v.layer==='Builder',days:Math.floor(age/(dayLen||86400)),rank:Math.max(0,RANKS.indexOf(v.rank))});
}
return{ENGINES,hash,pick:seed=>ENGINES[hash(seed+'engine')%ENGINES.length],pool:artPool,traits:traitsOf,TIER_TR,TIER_EN,encodeSketch,decodeSketch,fromChain,ageStage,AGE_TR,AGE_EN};
})();

Object.assign(STR.en,{moneyT:'What happens to your money',m1:'You put in {fee} NEAR. {dep} NEAR waits inside your soul and stays yours. {store} NEAR pays for your record on the chain and does not come back.',m2:'Nobody can spend what is inside your soul. Not us, not the vault, not another player. Only you can break it.',m3:'Break it whenever you like. The deposit comes back minus an exit tax. The tax starts at 50%, falls every day and stops at 5% on day 40.',m3f:'Break it whenever you like. The deposit comes back minus an exit tax. The tax starts at 50%, falls every minute and stops at 5% on minute 40.',m4:'The tax goes to the vault. The vault belongs to whoever still holds SABIR.',m5:'We take only {cc}% of soul sales. Nothing from entries, tolls, exit taxes or the vault.',calcL:'If you break your soul after',calcBack:'You get back',calcVault:'Goes to the vault',calcEarn:'SABIR earned',calcTax:'Exit tax',calcForm:'Its form',storyT1:'Example: three people, two give up early',storyT2:'Example: three people, nobody gives up',storyT3:'Example: a soul is sold',storyLeft:'Left on day {d}',storyLeftf:'Left on minute {d}',storyFirst:'First to leave',storySecond:'Second',storyLast:'Last to leave',saleP:'Price',saleS:'Seller gets',saleV:'To the vault',saleC:'To the creator',saleD:'Buyer also gets, inside',saleA:'Age of the soul',storyNote:'Each person put in {fee} NEAR. The totals are the deposit back plus the share of the vault for all the SABIR they earned. With more people the numbers change. Nothing is promised: the only money anyone can win is what others leave behind.',faqT:'Questions',f1q:'Who holds my money?',f1a:'The contract, inside your soul. The contract has no owner, and no function lets anyone else take it.',f2q:'Can I get it back?',f2a:'Any time. Break your soul and the deposit comes back minus the exit tax. The tax never reaches zero.',f3q:'What is SABIR good for?',f3a:'Burning it gives you a share of the vault: your SABIR divided by all the SABIR that exists. The older your coins, the lower the tax. It has no pool and no market price in this version.',f4q:'Will I make money?',f4a:'Nothing is promised. The only money anyone can win is what others leave behind. If nobody gives up, everyone pays at least 5% on the way out and the first to leave gets back less than they put in. This is a game, not an investment.',f5q:'Can I give my soul to someone?',f5a:'No. A soul changes hands only by being sold here, and every sale pays its cut. Every sale halves its age.',f6q:'What do the makers earn?',f6a:'{cc}% of every soul sale, paid at the moment of sale. Nothing from entries, tolls, exit taxes or the vault.',f7q:'Does it ever end?',f7a:'After 1,001 days the bridge closes. Nobody can enter and souls stop earning. Your deposit and your share of the vault stay there for you to take.',f7af:'This fast copy closes after 60 real days. Nobody can enter and souls stop earning. Your deposit and your share of the vault stay there for you to take.',f8q:'What if I close the page during the walk?',f8a:'The clock keeps running on the chain. Come back with the same wallet and carry on. A ticket never expires. Each account can cross once.',f9q:'What if this site disappears?',f9a:'The rules and the money live on NEAR, not here. You can always call the contract directly and break your soul.',f10q:'Is this real money?',f10a:'Not yet. This version runs on NEAR testnet, where NEAR is free test money.',enterT:'Before you step on',enterQ:'{fee} NEAR leaves your wallet. {dep} NEAR waits inside your soul and comes back when you break it, minus the exit tax. {store} NEAR pays for your record on the chain and does not come back. Each account can cross once.',enterGo:'Step on',buyT:'Buy this soul?',buyQ:'You pay {p} NEAR. The {d} NEAR inside becomes yours. Its age falls from {a} to {b}, so breaking it right away would return {r} NEAR. What it earned so far stays with the seller.',buyGo:'Buy',sellT:'Put it up for sale?',sellQ:'If it sells for {p} NEAR you get {s}, the vault {v} and the creator {c}. You can take it down until then. When it sells, the deposit inside goes to the buyer and its age halves.',more:'Show more',stale:'Its price is now below what breaking it returns. Raise it, or a stranger can buy it for less than it holds.',taxNow:'Exit tax today',taxIn:'Falls to the floor in',ifBought:'Buy and break at once'});
Object.assign(STR.tr,{moneyT:'Paran ne oluyor',m1:'{fee} NEAR koyarsın. {dep} NEAR ruhunun içinde durur ve senindir. {store} NEAR zincirdeki kaydının masrafıdır, geri gelmez.',m2:'Ruhunun içindekini kimse harcayamaz. Ne biz, ne kasa, ne başka oyuncu. Onu yalnız sen kırabilirsin.',m3:'İstediğin an kırarsın. Emanetin, çıkış vergisi düşülerek döner. Vergi %50 başlar, her gün azalır, 40. günde %5\'te durur.',m3f:'İstediğin an kırarsın. Emanetin, çıkış vergisi düşülerek döner. Vergi %50 başlar, her dakika azalır, 40. dakikada %5\'te durur.',m4:'Vergi kasaya gider. Kasa, hâlâ SABIR tutanlarındır.',m5:'Biz yalnız ruh satışlarının %{cc}\'ini alırız. Girişten, geçiş parasından, çıkış vergisinden ve kasadan hiçbir şey almayız.',calcL:'Ruhunu şu kadar sonra kırarsan',calcBack:'Geri alırsın',calcVault:'Kasaya kalır',calcEarn:'Kazandığın SABIR',calcTax:'Çıkış vergisi',calcForm:'Hâli',storyT1:'Örnek: üç kişi, ikisi erken vazgeçiyor',storyT2:'Örnek: üç kişi, kimse vazgeçmiyor',storyT3:'Örnek: bir ruh satılıyor',storyLeft:'{d}. günde çıktı',storyLeftf:'{d}. dakikada çıktı',storyFirst:'İlk çıkan',storySecond:'İkinci',storyLast:'Son çıkan',saleP:'Fiyat',saleS:'Satıcıya',saleV:'Kasaya',saleC:'Yaratıcıya',saleD:'Alıcıya, içindeki',saleA:'Ruhun yaşı',storyNote:'Herkes {fee} NEAR koydu. Toplamlar: emaneti geri alıp kazandığı bütün SABIR\'ı yakan kişinin eline geçen. Kişi sayısı değişince rakamlar da değişir. Söz verilen bir kazanç yok: kazanılabilecek tek para başkalarının bıraktığı.',faqT:'Sorular',f1q:'Param kimde duruyor?',f1a:'Kontratın içinde, ruhunda. Kontratın sahibi yok, başkasının onu almasını sağlayan bir işlev de yok.',f2q:'Geri alabilir miyim?',f2a:'İstediğin an. Ruhunu kırarsan emanetin, çıkış vergisi düşülerek döner. Vergi hiçbir zaman sıfır olmaz.',f3q:'SABIR ne işe yarar?',f3a:'Yakınca kasadan pay alırsın: senin SABIR\'ın bölü var olan bütün SABIR. Koinlerin ne kadar eskiyse vergi o kadar düşük. Bu sürümde havuzu ve piyasa fiyatı yok.',f4q:'Kazanır mıyım?',f4a:'Söz verilen bir şey yok. Kazanılabilecek tek para başkalarının bıraktığı. Kimse vazgeçmezse herkes çıkarken en az %5 öder, ilk çıkan koyduğundan az alır. Bu bir oyun, yatırım değil.',f5q:'Ruhumu birine verebilir miyim?',f5a:'Hayır. Ruh yalnız burada satılarak el değiştirir ve her satış payını öder. Her satış yaşını yarıya indirir.',f6q:'Yapanlar ne kazanıyor?',f6a:'Her ruh satışının %{cc}\'i, satış anında. Girişten, geçiş parasından, çıkış vergisinden ve kasadan hiçbir şey.',f7q:'Bitiyor mu?',f7a:'1.001 gün sonra köprü kapanır. Kimse giremez, ruhlar kazanmayı bırakır. Emanetin ve kasadaki payın almana hazır durur.',f7af:'Bu hızlı kopya 60 gerçek gün sonra kapanır. Kimse giremez, ruhlar kazanmayı bırakır. Emanetin ve kasadaki payın almana hazır durur.',f8q:'Yürürken sayfayı kapatırsam?',f8a:'Saat zincirde işlemeye devam eder. Aynı cüzdanla dönüp devam edersin. Bilet hiç eskimez. Her hesap bir kez geçebilir.',f9q:'Bu site kapanırsa?',f9a:'Kurallar ve para burada değil, NEAR üzerinde. Kontratı doğrudan çağırıp ruhunu her zaman kırabilirsin.',f10q:'Gerçek para mı?',f10a:'Henüz değil. Bu sürüm NEAR deneme ağında çalışıyor, oradaki NEAR bedava deneme parası.',enterT:'Köprüye çıkmadan',enterQ:'Cüzdanından {fee} NEAR çıkar. {dep} NEAR ruhunun içinde bekler, kırınca çıkış vergisi düşülerek döner. {store} NEAR zincirdeki kaydının masrafıdır, geri gelmez. Her hesap bir kez geçebilir.',enterGo:'Çık',buyT:'Bu ruh alınsın mı?',buyQ:'{p} NEAR ödersin. İçindeki {d} NEAR senin olur. Yaşı {a} iken {b} olur, hemen kırarsan {r} NEAR alırsın. O güne kadar kazandığı SABIR satıcıda kalır.',buyGo:'Al',sellT:'Satışa konsun mu?',sellQ:'{p} NEAR\'a satılırsa sana {s}, kasaya {v}, yaratıcıya {c} NEAR gider. O zamana kadar geri çekebilirsin. Satılınca içindeki emanet alıcıya geçer, yaşı yarıya iner.',more:'Daha fazla göster',stale:'Fiyatı artık kırınca alacağın paranın altında. Yükseltmezsen biri onu içindekinden ucuza alabilir.',taxNow:'Bugünkü çıkış vergisi',taxIn:'Tabana inmesine',ifBought:'Alıp hemen kırarsan'});

Object.assign(STR.en,{sy_beggar_help:'Someone had fallen on the bridge and you held out your hand. They got up and walked off without a word of thanks. You had no idea who they were; it could have been someone who would push you off that bridge.||You lifted someone off the ground. They did not even look at you, and left without thanks. A thief, maybe, or someone who would have pushed you; you held out your hand anyway.',sy_beggar_pass:'Someone had fallen on the bridge and you walked past without looking back. You never found out why they fell.||Someone lay on the ground. You did not slow down. Whether they got up, you will never know.',sy_beggar_wait:'Someone had fallen on the bridge. You neither helped nor walked on, and stood watching until they got up on their own.||You stood over someone who had fallen. You did not reach out and you did not move on. They got up by themselves while you were still watching.',sy_glyph_ok:'You worked out how the pattern on the stones went on and stepped on the right one.||The marks on the stones told you something, and you heard it. You stepped on the right one.',sy_glyph_fail:'You could not work out the pattern on the stones and stepped on the wrong one; the bridge shook but did not drop you.||You stepped on the wrong stone. The bridge shook for a moment, then carried you on.',sy_glyph_wait:'You studied the pattern on the stones for a long time but never stepped on one.||You looked and looked at the marks. The moment passed before you chose a stone.',sy_whisper_take:'A hidden passage lit up at the edge of the road and you took it. It gained you nothing.||A shortcut nobody knew about appeared, and you went through it. It did not gain you a single step.',sy_whisper_leave:'A hidden passage lit up at the edge of the road. Nobody would have seen you take it, and you left it alone.||A shortcut winked at you. Nobody would ever have known. You kept to your road.',sy_fork_hard:'Where the road split, you took the narrow side without anyone pushing you.||Two roads lay ahead, one narrow and one wide. You stepped onto the narrow one.',sy_fork_easy:'Where the road split you took the wide side, so you never saw where the narrow one led.||You chose the wide road. What waited at the end of the narrow one will stay unknown.',sy_fork_wait:'The road split and you could not choose; the bridge pushed you onto the wide side.||You stood between two roads. When you did not decide, your feet took you to the wide one.',sy_bud_grab:'You could not wait for the bud on the stone to open, so you picked it and were left holding a flower that never bloomed.||You picked the bud. In your palm lay a flower that will never open.',sy_bud_bloom:'You left the bud on the stone alone, and it opened in its own time.||You did not touch the bud. While you waited, it opened on the stone.',sy_balance_ok:'When the bridge thinned to a thread you found your balance and did not fall.||The bridge under you grew as thin as a thread. You did not fall.',sy_balance_no:'When the bridge thinned to a thread you swayed the whole way, but you did not let go.||On the thread you swung from side to side. You did not fall, but you were never steady.',sy_flame_end:'You were trusted with a flame, shielded it every time the wind came, and carried it across.||The flame in your palm shook in the wind. You shielded it, and it did not go out.',sy_flame_tight:'You were trusted with a flame and guarded it so tightly that it nearly went out for lack of air.||You held the flame so tightly it could not breathe. It almost died in your hands.',sy_flame_died:'You were trusted with a flame but could not shield it from the wind, and it went out in your hands.||The wind came and your hand was too late. The flame you were trusted with went out.',sy_away:'At one point you left the bridge for {s} seconds to look at something else.',sy_awayN:'You left the bridge {n} times to look at other things, {s} seconds in all.',sy_tempt:'Once your hand went to the way out, and you pulled it back.',sy_temptN:'Your hand went to the way out {n} times, and each time you pulled it back.',sy_shut:'Once you opened the way out, looked at the price and closed it again.',sy_shutN:'You opened the way out {n} times to look at the price, and closed it each time.',sy_paid:'{t} seconds in, you paid {v} NEAR and skipped the rest of the bridge.',sy_left:'What was waiting on the part you skipped: {list}.',sy_and:' and ',sy_m_beggar:'someone who had fallen',sy_m_glyph:'a pattern cut into stone',sy_m_whisper:'a hidden passage',sy_m_fork:'a road that split in two',sy_m_bud:'a bud waiting to open',sy_m_balance:'a bridge as thin as a thread',sy_m_flame:'a flame that was meant for you',sy_paidM:'Your hurry became the reward of those who waited.||You reached the other side without seeing the road.',sy_end:'You walked the full five minutes and crossed the bridge for free.||You walked to the very end. The bridge takes no toll from those who wait.',sy_c1:'You helped the fallen one up, then took the shortcut when nobody was watching; you were kind to a stranger but not honest with yourself.||The one who lifted a stranger and the one who took the shortcut when nobody was looking were both you.',sy_c2:'You walked past the fallen one and took the hidden passage, thinking nobody saw; the bridge wrote both down.||You neither lifted the fallen nor left the shortcut. You thought nobody saw. The bridge did.',sy_c3:'You helped no one, and you took nothing from anyone.||No kindness and no cheating. You walked your own road.',sy_c4:'You acted the same when someone needed you and when nobody was watching.||You lifted the fallen and left the shortcut alone. Nobody applauded, and you did not wait for it.',sy_c5:'Waiting worked with the bud but not with the flame; there you needed to raise your hand.||Waiting made the bud open, and waiting let the flame die.',sy_c6:'You could not wait for the bud, yet you guarded the flame to the end; protecting something comes easier to you than waiting for it.||You had no patience for the bud, but you never let go of the flame. Your hands are patient; your eyes are not.'});
Object.assign(STR.tr,{sy_beggar_help:'Köprüde düşen birine elini uzattın. Kalktı ve teşekkür etmeden yürüyüp gitti. Kim olduğunu bilmeden uzatmıştın; seni o köprüden itecek biri de olabilirdi.||Yere düşmüş birini kaldırdın. Yüzüne bile bakmadı, teşekkür etmeden gitti. Belki bir hırsızdı, belki seni sırtından itecekti; sen yine de elini uzattın.',sy_beggar_pass:'Köprüde düşen birinin yanından geçip gittin, arkana da bakmadın. Neden düştüğünü hiç öğrenmedin.||Biri yerde yatıyordu. Adımını yavaşlatmadın. Kalktı mı, kalkamadı mı, bilmiyorsun.',sy_beggar_wait:'Köprüde biri düşmüştü. Elini uzatmadın, yanından da geçmedin; o kendi kalkana kadar durup baktın.||Düşen birinin başında durdun. Ne elini uzattın ne yürüdün. O kendi kalktı, sen hâlâ bakıyordun.',sy_glyph_ok:'Taşlara kazınmış örüntüyü çözüp doğru taşa bastın.||Taştaki işaretler sana bir şey söyledi, sen de duydun. Doğru taşa bastın.',sy_glyph_fail:'Taştaki örüntüyü çözemeyip yanlış taşa bastın; köprü sallandı ama seni düşürmedi.||Yanlış taşa bastın. Köprü bir an sarsıldı, sonra seni yine taşıdı.',sy_glyph_wait:'Taştaki örüntüye uzun uzun baktın ama hiçbir taşa basmadın.||İşaretlere baktın da baktın. Bir taş seçemeden an geçip gitti.',sy_whisper_take:'Yolun kenarında gizli bir geçit parladı, sen de aldın. Sana hiçbir şey kazandırmadı.||Kimsenin bilmediği bir kestirme göründü, sen de oradan geçtin. Sana bir adım bile kazandırmadı.',sy_whisper_leave:'Yolun kenarında gizli bir geçit parladı. Alsan kimse görmeyecekti, yine de dokunmadın.||Bir kestirme sana göz kırptı. Kimse bilmeyecekti. Yolundan şaşmadın.',sy_fork_hard:'Yol ikiye ayrılınca kimse zorlamadan dar olanı seçtin.||Önünde biri dar, biri geniş iki yol vardı. Darına bastın.',sy_fork_easy:'Yol ikiye ayrılınca geniş olanı seçtin; dar yolun nereye çıktığını göremedin.||Geniş yolu seçtin. Dar olanın sonunda ne vardı, artık bilinmeyecek.',sy_fork_wait:'Yol ikiye ayrıldı, sen seçemedin; köprü seni geniş olana itti.||İki yolun ortasında kaldın. Karar vermeyince ayakların seni genişine götürdü.',sy_bud_grab:'Taşın üstündeki tomurcuğun açmasını bekleyemeyip kopardın; elinde hiç açmamış bir çiçek kaldı.||Tomurcuğu kopardın. Avucunda hiç açmayacak bir çiçek kaldı.',sy_bud_bloom:'Taşın üstündeki tomurcuğa dokunmadın, kendi vaktinde açtı.||Tomurcuğa elini sürmedin. Sen beklerken taşın üstünde açtı.',sy_balance_ok:'Köprü bir ipliğe döndüğünde dengeni buldun, düşmedin.||Altındaki köprü bir iplik kadar inceldi. Sen düşmedin.',sy_balance_no:'Köprü bir ipliğe döndüğünde yol boyu sallandın ama bırakmadın.||İplikte sağa sola savruldun. Düşmedin ama dengede de değildin.',sy_flame_end:'Sana emanet edilen alevi rüzgâr her geldiğinde siperledin ve karşıya taşıdın.||Avucundaki alev rüzgârda titredi. Sen siper oldun, o da sönmedi.',sy_flame_tight:'Sana emanet edilen alevi öyle sıkı korudun ki havasız kalıp az kaldı sönüyordu.||Alevi öyle sıkı tuttun ki nefes alamadı. Az kalsın senin elinde sönüyordu.',sy_flame_died:'Sana emanet edilen alevi rüzgâra karşı koruyamadın, senin elinde söndü.||Rüzgâr geldi, elin geç kaldı. Sana emanet edilen alev söndü.',sy_away:'Bir ara {s} saniye köprüyü bırakıp başka bir şeye baktın.',sy_awayN:'Köprüyü {n} kez bırakıp başka şeylere baktın, toplam {s} saniye.',sy_tempt:'Elin bir kez çıkış düğmesine gitti, sonra geri çektin.',sy_temptN:'Elin {n} kez çıkış düğmesine gitti, her seferinde geri çektin.',sy_shut:'Bir kez çıkış kapısını açıp bedeline baktın, sonra kapattın.',sy_shutN:'Çıkış kapısını {n} kez açıp bedeline baktın, her seferinde kapattın.',sy_paid:'{t}. saniyede {v} NEAR ödeyip köprünün kalanını atladın.',sy_left:'Atladığın yolda seni bekleyenler: {list}.',sy_and:' ve ',sy_m_beggar:'düşen biri',sy_m_glyph:'taşa kazınmış bir örüntü',sy_m_whisper:'gizli bir geçit',sy_m_fork:'ikiye ayrılan bir yol',sy_m_bud:'açmayı bekleyen bir tomurcuk',sy_m_balance:'ipliğe dönen bir köprü',sy_m_flame:'sana emanet edilecek bir alev',sy_paidM:'Senin acelen, bekleyenin kazancı oldu.||Karşıya vardın ama yolu görmedin.',sy_end:'Beş dakikayı sonuna kadar yürüdün ve köprüden bedava geçtin.||Sonuna kadar yürüdün. Köprü, bekleyenden geçiş parası almaz.',sy_c1:'Düşeni kaldırdın, sonra kimse görmüyor diye kestirmeye saptın; başkasına karşı iyiydin ama kendine karşı dürüst değildin.||Bir yabancıya elini uzatan da sendin, kimse bakmazken kestirmeye sapan da.',sy_c2:'Düşenin yanından geçtin, gizli geçidi de aldın ve kimsenin görmediğini sandın; köprü ikisini de yazdı.||Ne düşeni kaldırdın ne kestirmeden vazgeçtin. Kimse görmedi sandın; köprü gördü.',sy_c3:'Kimseye el uzatmadın, kimseden bir şey de almadın.||Ne iyilik ettin ne hile. Kendi yolunu yürüdün.',sy_c4:'Biri yardım beklerken de, kimse bakmıyorken de aynı davrandın.||Düşeni kaldırdın, kestirmeye dokunmadın. Kimse alkışlamadı, sen de beklemedin.',sy_c5:'Tomurcukta beklemek işe yaradı, alevde yaramadı; orada elini kaldırman gerekiyordu.||Tomurcuğu bekleyerek açtırdın, alevi bekleyerek söndürdün.',sy_c6:'Tomurcuğu bekleyemedin ama alevi sonuna kadar korudun; bir şeyi korumak sana beklemekten kolay geliyor.||Tomurcuğa sabredemedin ama alevi bırakmadın. Elin sabırlı, gözün aceleci.'});
let chainParams=null;
const PARAM0={entry_fee:'1000000000000000000000000',toll_start:'1000000000000000000000000',sale_vault_bps:200,sale_creator_bps:100,seed:'40000000000000000000',daily_sabir:FAST?'1440000000000000000000':'1000000000000000000',max_tax_bps:5000,min_tax_bps:500,full_patience_secs:FAST?2400:3456000};
const P=()=>chainParams||PARAM0;
const TOLL0=()=>Number(BigInt(P().toll_start)/10n**18n)/1e6;

// Frame logic
function tick(d){
  time+=d;
  if(phase==='walk'){
    S.t=Math.min(DUR,S.t+d);
    updateTrials(d);
    watch();
    checkWhispers();
    if(S.t>=DUR)arrive();
  }else if(phase==='warp'){
    S.warp+=d;
    if(S.warp>=2.4){flash=.8;toConfess()}
  }else if(phase==='weigh'){
    S.wt+=d;
    if(S.wt>=2.6&&!S.flash){S.flash=true;flash=1;shake=.3;tak();sur()}
    if(S.wt>=4.3)showResult();
  }
  shake=Math.max(0,shake-d*1.1);flash=Math.max(0,flash-d*1.2);
  const targetRoll=(cur&&cur.id==='balance')?bal*10:0;
  roll+=(targetRoll-roll)*Math.min(1,d*8);
  for(let i=FX.length-1;i>=0;i--){const p=FX[i];p.l-=d/p.d;p.x+=p.vx*d;p.y+=p.vy*d;p.vy+=60*d;if(p.l<=0)FX.splice(i,1)}
}

function proj(x,y,z){const dz=Math.max(.05,z-camZ),s=F/dz;return{x:W/2+(x-camX)*s,y:HY-(y-camY)*s,s}}

function drawBridge(){
  const top=Math.min(Math.ceil(camZ+92),Math.ceil(L+6));
  const bottom=Math.floor(camZ+.5);
  for(let z=top;z>=bottom;z--){
    const z1=Math.max(z,camZ+.42),z2=z+1;
    if(z2<=z1)continue;
    const dz=z1-camZ,A=strips(z1),B=strips(z2),n=Math.min(A.length,B.length);

  else if(phase==='landing')camZ=2;
  else camZ=L-2;
  camV=d>0?(camZ-lastZ)/d:0;lastZ=camZ;
  const q=unit(camZ/L);
  const narrow=.12+.88*(halfW(camZ)/2.33);
  const lat=(forkChoice&&camZ>=forkA&&camZ<=forkB)?forkChoice*forkOff(camZ):0;
  const bx=(cur&&cur.id==='balance')?bal*.12:0;
  camX=Math.sin(time*.65)*.08*motion*narrow+lat+bx;
  camY=1.05+Math.sin(time*1.35)*.045*motion;
  const warpK=phase==='warp'?Math.sin(Math.PI*unit(S.warp/2.4)):0;
  const baseF=Math.min(W,H*1.3)*1.02;F=baseF*(1+.55*warpK);
  g.setTransform(DPR,0,0,DPR,0,0);
  g.save();

async function audioTest(){
  const off=new OfflineAudioContext(1,44100*8,44100),keep=[AC,bus,drone,master,AT];
  AC=off;const g0=graph(off);bus=g0.in0;g0.out.gain.value=VOL;g0.dr.gain.setValueAtTime(1,0);
  AT=1;tak();AT=2;rumble();AT=3.5;bell();AT=4;sur();

function analyse(x,sr){
  let peak=0,sum=0;for(let i=0;i<x.length;i++){const v=Math.abs(x[i]);if(v>peak)peak=v;sum+=x[i]*x[i]}
  let up=0,all=0,cen=0;const N=2048;for(let w=0;w<14;w++){const st=Math.floor((w+.5)*(x.length-N)/14);for(let k=1;k<160;k++){const hz=k*sr/N;let re=0,im=0;for(let i=0;i<N;i+=2){const c=2*Math.PI*k*i/N;re+=x[st+i]*Math.cos(c);im+=x[st+i]*Math.sin(c)}const m=re*re+im*im;all+=m;cen+=hz*m;if(hz>=500)up+=m}}
  return{tepe:+peak.toFixed(3),ortalama:+Math.sqrt(sum/x.length).toFixed(4),merkezHz:Math.round(cen/all),yuksekPay:+(up/all).toFixed(4)};
}

const floorOf=(v,seen)=>{const age=v.age_secs+Math.floor((Date.now()-seen)/1000)+120;return Math.ceil(nearNum(v.deposit)*(1-taxBps(age)/1e4)*1000)/1000};

  const d=STOPS[+$('calcR').value]||0,t=taxBps(d*gameDay()),dep=depNear(),tax=dep*t/1e4,box=$('calcOut');
  $('calcD').textContent=dayText(d);

// What each person ends up with: the deposit back, plus the vault's share for all they earned.
function story(days){
  const dep=depNear(),seed=tokNum(P().seed);let vault=0;
  return days.map((d,i)=>{
    const t=taxBps(d*gameDay())/1e4;
    vault+=dep*t;
    const net=d/(seed+d*(days.length-i))*vault*(1-t);
    vault-=net;
    return dep*(1-t)+net;
  });
}

  const box=$('onchain');box.hidden=false;box.innerHTML='';
  if(!crossing||!crossing.soul){const p=document.createElement('p');p.textContent=T('practiceEnd');box.appendChild(p);return}
  const s=crossing.soul,b=document.createElement('b'),p=document.createElement('p');
  b.textContent=T('soulN').replace('{n}',s.token_id);
  p.textContent=T('onchainP').replace('{x}',num(nearNum(s.deposit),3));
  box.append(b,p);
  $('again').textContent=T('toMarket');
}

// Walking for real
async function enterNow(){
  const who=me();
  try{
    busy(T('txEnter'),T('txWork'));
    await send('enter_gate',{},BigInt(P().entry_fee));
    const h=await waitFor(async()=>{const x=await view('get_holder',{account_id:who});return x&&x.ticket?x:null},20,700);
    idle();
    if(!h)return;
    crossing={entered:h.ticket.entered,soul:null};
    begin(Math.max(0,Math.min(DUR-1,chainNow()-h.ticket.entered)));
  }catch(e){txFailed(e,enterNow)}
}
async function startClick(){
  const who=me();
  if(!who){begin(0);return}
  try{
    busy(T('txEnter'),'');
    const h=await view('get_holder',{account_id:who});
    idle();
    if(!h||!h.ticket){ask(T('enterT'),T('enterQ'),T('enterGo'),enterNow);return}
    if(h.ticket.passed){$('mineBox').scrollIntoView({behavior:'smooth'});return}
    crossing={entered:h.ticket.entered,soul:null};
    begin(Math.max(0,Math.min(DUR-1,chainNow()-h.ticket.entered)));
  }catch(e){txFailed(e,startClick)}
}
function packRun(){
  M=measure();M.title=M.titleEn;
  M.seals=[C.generous>0,C.glyphOk>0,C.resisted>0,C.forkHard>0,C.bloomed>0,C.balance>0,C.lightCarried>0&&!C.overheld];
  try{sessionStorage.setItem('sabir-run',JSON.stringify({M,C,Q,t:S.t,skipped:S.skipped,skipT:S.skipT,REC:Object.assign({},REC,{a:Array.from(REC.a)})}))}catch(e){}
  return toB64(SOULS.encodeSketch(M));
}
async function crossNow(skip){
  try{
    const sketch=packRun();
    busy(T('txCross'),T('txWork'));
    if(!skip){const w=crossing.entered+DUR+2-chainNow();if(w>0&&SPEED===1)await new Promise(r=>setTimeout(r,w*1000))}
    const toll=skip?tollAt(chainNow()-crossing.entered):0;
    await send('pass_gate',{sketch},skip?toYocto(toll+.01):0n);
    await crossed(skip);
  }catch(e){
    if(skip){S.skipped=false;S.skipT=null;phase='walk';txFailed(e)}
    else txFailed(e,()=>crossNow(false));
  }
}
async function crossed(skip){
  const who=me();
  const got=await waitFor(async()=>(await mySouls()).find(s=>s.crossed_by===who)||null,20,700);
  idle();
  crossing.soul=got;
  if(got)S.seed=got.seed;
  try{sessionStorage.removeItem('sabir-run')}catch(e){}
  if(skip){S.skipped=false;S.skipT=null;phase='walk';doSkip()}else toConfess();
}
function arrive(){if(!crossing){toConfess();return}phase='sign';crossNow(false)}
function payGoClick(){
  if(!crossing){doSkip();return}
  if(phase!=='walk')return;
  closePay();S.skipped=true;S.skipT=Math.floor(S.t);phase='sign';crossNow(true);
}
async function chainStart(){
  try{await chainInit()}catch(e){console.warn('wallet',e);return}
  drawWallet();
  const who=me();let run=null;
  try{run=JSON.parse(sessionStorage.getItem('sabir-run'))}catch(e){}
  if(!run||!who)return;
  const h=await view('get_holder',{account_id:who});
  if(!h||!h.ticket||!h.ticket.passed)return;
  // Back from a wallet that left the page: finish the crossing that was waiting for it.
  Object.assign(C,run.C);Object.assign(Q,run.Q);Object.assign(REC,run.REC,{a:Float32Array.from(run.REC.a)});
  S.t=run.t;S.skipped=run.skipped;S.skipT=run.skipT;M=run.M;
  crossing={entered:h.ticket.entered,soul:null};
  document.body.classList.add('playing');phase='sign';
  await crossed(false);
}
let wallData=null;
function drawWalls(){
  if(!wallData)return;
  const ours=/(^|\.)sabir-(alice|bob|carol|creator|t\d+-[a-z])\.testnet$/,short=w=>w.replace('.testnet','')+(ours.test(w)?T('ourTest'):'');
  $('w1').innerHTML=wallData.filter(e=>e.kind==='skip').slice(0,6).map(e=>`<li>${T('wallSkip').replace('{w}',short(e.who)).replace('{t}',e.detail).replace('{x}',money(Number(e.near)/1e24))}</li>`).join('');
  $('w2').innerHTML=wallData.filter(e=>e.kind==='wait').slice(0,6).map(e=>`<li>${T('wallWait').replace('{w}',short(e.who))}</li>`).join('');
}
function loadWalls(){if(wallData){drawWalls();return}view('get_log',{limit:30}).then(d=>{if(d){wallData=d.slice().reverse();drawWalls()}})}

if(DEV)document.body.classList.add('dev');
if(DEV)window.__bridge={SOULS,get crossing(){return crossing},REC,Q,QSLOTS,get curQ(){return curQ},audioTest,S,C,begin,tick,measure,closeTrial,byId,TRIALS,doSkip,get phase(){return phase},get cur(){return cur},confessAnswer(v){const b=[...$('choices').querySelectorAll('button')][v?1:0];if(b)b.click()}};
applyLang();
if(DEV&&qs.has('nohero'))document.querySelector('.hero').style.display='none';
if(DEV&&qs.get('end')){
  const b=qs.get('end')==='builder';
  Object.assign(C,b?{generous:1,glyphOk:1,resisted:1,forkHard:1,bloomed:1,balance:1,lightCarried:1,selfPatient:1,selfBrave:1,selfHonest:1,decSum:12,decN:2}:{selfPatient:1,selfBrave:1,selfHonest:1});
  S.skipped=!b;S.skipT=b?null:41;S.seed='end-'+qs.get('end');
  document.body.classList.add('playing');phase='weigh';M=measure();S.wt=9;showResult();
}
else if(STARTAT!==null)begin(STARTAT);
if(!FRONT)chainStart();
setInterval(()=>{document.querySelectorAll('[data-live]').forEach(x=>{const age=+x.dataset.age+(Date.now()-x.dataset.at)/1000,b=taxBps(age);x.textContent=x.dataset.live==='tax'?pct(b):x.dataset.live==='break'?num(+x.dataset.dep*(1-b/1e4),3)+' NEAR':dayText(Math.max(0,Math.ceil((+P().full_patience_secs-age)/gameDay())))});if(bridgeEnd&&chainNow()>=bridgeEnd)return;document.querySelectorAll('.earn').forEach(x=>{x.textContent=num(+x.dataset.e+(Date.now()-x.dataset.at)/(gameDay()*1000),5)})},1000);
let hiddenAt=0;document.addEventListener('visibilitychange',()=>{if(document.hidden){hiddenAt=Date.now();return}if(hiddenAt&&Date.now()-hiddenAt>60000&&phase!=='walk'&&chainUp)chainUp.then(()=>refreshChain()).catch(()=>{});hiddenAt=0});
requestAnimationFrame(frame);
})();
</script>
